nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:8px 4px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.on{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
form{display:grid;gap:12px}
label{display:grid;gap:4px;color:var(--mute);font-size:14px}
.lb{display:flex;align-items:center;gap:6px}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{padding:12px;border:0;border-radius:8px;background:var(--brass);color:#1a1405;font:600 16px system-ui;display:flex;align-items:center;justify-content:center;gap:8px}
.fish{background:var(--panel);border-radius:12px;overflow:hidden;margin-bottom:16px}
.fish img{display:block;width:100%;max-height:420px;object-fit:cover}
.body{padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.len{font:700 44px/1 Georgia,serif;color:var(--brass);grid-row:span 2}
.len small{font-size:20px}
.t{display:flex;align-items:center;gap:8px;font-weight:600}
.m{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.m.note{color:var(--ink);align-items:flex-start;font-size:15px}
.m.note .ic{margin-top:3px}
.det{grid-column:1/-1;display:grid;gap:6px;margin-top:8px}
.del{grid-column:1/-1;justify-self:end;display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:4px 0}
.empty{color:var(--mute);text-align:center;padding:32px 0}
.empty .ic{width:48px;height:48px;color:var(--brass);display:block;margin:0 auto 8px}
.tools{text-align:center;margin:24px 0}
.tools button{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:8px;font:inherit}
.pvw{overflow-x:auto;margin:12px 0}.pv{border-collapse:collapse;font-size:13px;white-space:nowrap}.pv th,.pv td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}.bad{color:#ff9d8a}
details{margin:4px 0 12px}summary{color:var(--mute);cursor:pointer;margin-bottom:8px}
.ic.wide{width:2.6em;height:1.05em}.empty .ic.wide{width:130px;height:53px}
.bar{display:grid;gap:12px;margin-bottom:16px}
.gh{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;margin:4px 0 12px;font:inherit;text-align:left}
.gh .n{font-weight:600;flex:1}.gh .s{color:var(--mute);font-size:13px}.gh .ic{color:var(--brass)}
.gh .chev{color:var(--mute);transition:transform .15s}.grp.shut .chev{transform:rotate(-90deg)}.grp{margin-bottom:8px}
.sec{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.sec h2{font:700 18px Georgia,serif;margin:0 0 10px;display:flex;align-items:center;gap:8px}.sec h2 .ic{color:var(--brass)}
.sec .row{margin-bottom:10px}.sec select{background:var(--bg)}
.ibar{display:grid;grid-template-columns:34% 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bt{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bf{height:100%;background:var(--brass);border-radius:5px}
.iv{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}.sm{color:var(--mute);font-size:13px}
.tools button{margin:4px}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(#6ca5b0,#346d7e);transition:opacity .5s}
#splash img{display:block;width:100%;height:100%;object-fit:cover}
#splash.out{opacity:0;pointer-events:none}
@media (min-aspect-ratio:1/1){#splash img{object-fit:contain}}

<script>
const $=s=>document.querySelector(s);
const SPLASH_MS=3000,T0=Date.now();
function hideSplash(){const sp=$('#splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),600)}
$('#splash').onclick=hideSplash;setTimeout(hideSplash,SPLASH_MS+5000);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
let db;
const open=indexedDB.open('muskielog',1);
open.onupgradeneeded=()=>open.result.createObjectStore('catches',{keyPath:'id'});
open.onsuccess=()=>{db=open.result;load().then(()=>setTimeout(hideSplash,Math.max(0,SPLASH_MS-(Date.now()-T0))));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()};
const store=m=>db.transaction('catches',m).objectStore('catches');
const run=q=>new Promise(r=>{q.onsuccess=()=>r(q.result)});
const all=()=>run(store('readonly').getAll());
const put=c=>run(store('readwrite').put(c));
const del=id=>run(store('readwrite').delete(id));

function show(w){if(w!=='add'&&EDIT)endEdit();for(const k of ['log','add','ins','imp'])$('#'+k).hidden=w!==k;
 for(const x of [['log','tl'],['add','ta'],['ins','tx'],['imp','ti']])$('#'+x[1]).classList.toggle('on',w===x[0]);
 if(w==='ins')renderInsights()}
$('#ti').onclick=()=>show('imp');$('#tx').onclick=()=>show('ins');$('#tl').onclick=()=>show('log');$('#ta').onclick=()=>show('add');

function setDefaults(){const n=new Date();
 $('#f').date.value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
setDefaults();

async function shrink(file){
 const img=new Image();img.src=URL.createObjectURL(file);await img.decode();
 const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
 const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}

let EDIT=null,BACKY=0;
$('#f').onsubmit=async e=>{e.preventDefault();
 const f=e.target,v=n=>f[n].value.trim(),file=$('#photo').files[0],L=v('length');
 const rec=EDIT?Object.assign({},EDIT):{id:uid(),created:Date.now(),photo:null};
 Object.assign(rec,{date:v('date')||'Unknown',time:v('time'),length:L==='??'?'??':parseFloat(L),
  species:v('species'),lake:v('lake'),angler:v('angler'),lure:v('lure'),pattern:v('pattern'),weather:v('weather'),
  spot:v('spot'),notes:v('notes'),figure8:f.f8.checked,firstCast:f.fc.checked});
 if(EDIT&&rec.pattern!==EDIT.pattern)rec.patternAssumed=false;
 else if(EDIT&&EDIT.patternAssumed&&rec.lure!==EDIT.lure){rec.pattern='';rec.patternAssumed=false}
 if(file)rec.photo=await shrink(file);else if(EDIT&&f.rmpic.checked)rec.photo=null;
 rec.noPic=!rec.photo&&f.nopic.checked;
 if(EDIT&&rec.lure!==EDIT.lure)rec.lureAssumed=false;assumeLure(rec);
 await put(rec);const was=!!EDIT,y=BACKY;endEdit();await load();show('log');if(was)scrollTo(0,y);
};
function startEdit(c){
 const f=$('#f');if(EDIT)endEdit();EDIT=c;BACKY=scrollY;f.reset();
 for(const n of ['time','species','lake','angler','lure','pattern','weather','spot','notes'])f[n].value=c[n]||'';
 f.date.value=c.date&&c.date!=='Unknown'?c.date:'';f.date.required=false;
 f.length.value=c.length==null?'':String(c.length);
 f.nopic.checked=!!c.noPic&&!c.photo;f.f8.checked=!!c.figure8;f.fc.checked=!!c.firstCast;
 $('#edhead').hidden=false;$('#phl').textContent=c.photo?'Replace photo':'Photo';
 if(c.photo){$('#curpic').src=URL.createObjectURL(c.photo);$('#curpic').hidden=false;$('#rmpicl').hidden=false}
 $('#fgo span').textContent='Save changes';show('add');scrollTo(0,0)}
function endEdit(){
 const f=$('#f');EDIT=null;f.reset();setDefaults();f.date.required=true;
 $('#edhead').hidden=true;$('#phl').textContent='Photo';$('#rmpicl').hidden=true;
 const cp=$('#curpic');if(cp.src){URL.revokeObjectURL(cp.src);cp.removeAttribute('src')}cp.hidden=true;
 $('#fgo span').textContent='Save catch'}
$('#edcancel').onclick=()=>{const y=BACKY;endEdit();show('log');scrollTo(0,y)};
function viewPhoto(src){
 const v=el('div'),i=el('img'),x=el('button','vx','Close');v.id='viewer';i.src=src;i.alt='Photo of the catch';v.append(i,x);
 const close=()=>{v.remove();removeEventListener('popstate',close);document.removeEventListener('keydown',kd)};
 const shut=()=>{close();history.back()};
 const kd=e=>{if(e.key==='Escape')shut()};
 v.onclick=shut;document.addEventListener('keydown',kd);
 history.pushState({viewer:1},'');addEventListener('popstate',close);document.body.append(v)}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const NS='http://www.w3.org/2000/svg';
function ic(n){
 if(n==='fish'){const f=document.createElement('span');f.className='fi musky';f.setAttribute('aria-hidden','true');return f}
 const s=document.createElementNS(NS,'svg'),u=document.createElementNS(NS,'use');
 s.setAttribute('class','ic'+(n==='fish'?' wide':''));s.setAttribute('aria-hidden','true');u.setAttribute('href','#i-'+n);s.append(u);return s}
function speciesIcon(sp){const k=(sp||'').toLowerCase();
 if(k==='muskellunge'||k==='muskie'||k==='musky'||k==='tiger muskie')return ic('fish');
 if(k==='northern pike'||k==='pike'){const f=ic('fish');f.className='fi pike';return f}
 return ic('fishgen')}
const lakeName=n=>/\b(lake|flowage|river|reservoir|pond|creek|chain|unknown)\b/i.test(n)?n:n+' Lake';
function line(n,t,cls){const d=el('div','m'+(cls?' '+cls:''));d.append(typeof n==='string'?ic(n):n,el('span','',t));return d}
function lureIcon(n){const f=document.createElement('span');n=n||'';
 f.className='li '+(/medu?s+a|realistic crankbait|orange tail/i.test(n)?'medussa':/mepps\s*5|weedkiller|giantkiller|giant killer/i.test(n)?'suick bucktail':/bobblehead/i.test(n)?'suick topwater':/blue dart|hellhound/i.test(n)?'suick bluedart':'suick');
 f.setAttribute('aria-hidden','true');return f}
function special(t){const d=el('div','m special'),h=document.createElement('span');h.className='hk rot';h.setAttribute('aria-hidden','true');d.append(h,el('span','',t));return d}
function wicon(w){w=w.toLowerCase();
 return /dusk|dawn|night|evening|twilight/.test(w)?'moon':/snow|sleet/.test(w)?'snow':/rain|drizzle|shower/.test(w)?'rain':/partly/.test(w)?'cloudsun':/sunny|clear/.test(w)?'sun':'cloud'}

let ALL=[];
const VIEW=(()=>{let v={};try{v=JSON.parse(localStorage.getItem('muskie-view'))||{}}catch(e){}return{sort:v.sort||'new',group:v.group||'none',q:''}})();
function saveView(){try{localStorage.setItem('muskie-view',JSON.stringify({sort:VIEW.sort,group:VIEW.group}))}catch(e){}}
const dkey=c=>/^\d{4}-\d\d-\d\d$/.test(c.date||'')?c.date+(c.time||''):null;
const lkey=c=>typeof c.length==='number'?c.length:null;
const cmpOpt=(x,y,f)=>x===y?0:x===null?1:y===null?-1:f(x,y);
const SORTS={new:(a,b)=>cmpOpt(dkey(a),dkey(b),(x,y)=>y.localeCompare(x)),
 old:(a,b)=>cmpOpt(dkey(a),dkey(b),(x,y)=>x.localeCompare(y)),
 long:(a,b)=>cmpOpt(lkey(a),lkey(b),(x,y)=>y-x)||SORTS.old(a,b),
 short:(a,b)=>cmpOpt(lkey(a),lkey(b),(x,y)=>x-y)||SORTS.new(a,b),
 photo:(a,b)=>(!!b.photo-!!a.photo)||SORTS.new(a,b),nophoto:(a,b)=>(!!a.photo-!!b.photo)||SORTS.new(a,b)};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const GROUPS={
 day:{icon:'calendar',time:1,key:c=>dkey(c)?c.date:'',label:k=>MONTHS[+k.slice(5,7)-1]+' '+(+k.slice(8,10))+', '+k.slice(0,4)},
 month:{icon:'calendar',time:1,key:c=>dkey(c)?c.date.slice(0,7):'',label:k=>MONTHS[+k.slice(5,7)-1]+' '+k.slice(0,4)},
 year:{icon:'calendar',time:1,key:c=>dkey(c)?c.date.slice(0,4):''},
 lake:{icon:'lake',key:c=>c.lake},species:{icon:'fish',key:c=>c.species},angler:{icon:'person',key:c=>c.angler},
 lure:{icon:'hook',key:c=>c.lure},luremix:{icon:'hook',key:c=>c.lure&&(c.lure+(c.pattern?' ('+c.pattern+')':''))},
 color:{icon:'hook',key:c=>c.pattern},weather:{icon:null,key:c=>c.weather}};
const t12=t=>{const p=t.split(':'),h=+p[0];return ((h%12)||12)+':'+p[1]+' '+(h<12?'AM':'PM')};

function card(c){
 const card=el('article','fish');
 if(c.photo){const i=el('img');i.src=URL.createObjectURL(c.photo);i.alt='Photo of the catch';i.onclick=()=>viewPhoto(i.src);card.append(i)}
 const b=el('div','body');
 const len=el('div','len',String(c.length));if(typeof c.length==='number')len.append(el('small','','″'));
 const head=el('div','head');head.append(len);
 const sp=el('div','sp'),sib=el('div','ib');sib.append(speciesIcon(c.species));sp.append(sib,el('div','it',c.species||'Fish'));head.append(sp);
 if(c.lure){const lu=el('div','sp lu'),lib=el('div','ib');lib.append(lureIcon(c.lure));
  lu.append(lib,el('div','it',c.lure+(c.lureAssumed?'*':'')+(c.pattern?' ('+c.pattern+(c.patternAssumed&&!c.lureAssumed?'*':'')+')':'')));head.append(lu)}
 b.append(head);
 const det=el('div','det');
 const when=line('calendar',c.date);
 if(c.time)when.append(ic('clock'),el('span','',t12(c.time)));
 det.append(when);
 if(c.lake)det.append(line('lake',lakeName(c.lake)));
 if(c.spot)det.append(line('pin',c.spot));
 if(c.weather)det.append(line(wicon(c.weather),c.weather));
 if(c.angler)det.append(line('person',c.angler));

 if(parsed.length||upd.length){const b=el('button','go','Import '+parsed.length+' catches'+(upd.length?' and update '+upd.length:''));b.type='button';
  b.onclick=async()=>{
   for(const r of parsed){const c=Object.assign({},r);delete c.unknown;await put(Object.assign({id:uid(),created:Date.now(),photo:null},c))}
   for(const x of upd){if(x.r.noPic&&!x.c.photo)x.c.noPic=true;if(x.r.figure8)x.c.figure8=true;if(x.r.firstCast)x.c.firstCast=true;await put(x.c)}
   parsed=[];upd=[];await load();show('log')};
  out.append(b)}
};
const XS={metric:'count',view:'lure'};
const AVG=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0;
const MAXV=a=>Math.max.apply(null,a);
const lensOf=r=>r.map(c=>c.length);
const nC=n=>n+(n===1?' catch':' catches');
const dl=d=>/^\d{4}-\d\d-\d\d$/.test(d||'')?GROUPS.day.label(d):'';
const grp=(rows,f)=>{const m=new Map();for(const c of rows){const k=f(c)||'';if(!m.has(k))m.set(k,[]);m.get(k).push(c)}return [...m]};
function sec(icon,title){const s=el('section','sec'),h=el('h2');h.append(typeof icon==='string'?ic(icon):icon,el('span','',title));s.append(h);return s}
function bars(s,items){
 const mx=Math.max.apply(null,items.map(i=>i.v).concat([1]));
 for(const i of items){const r=el('div','ibar'),l=el('div','il',i.label);if(i.sub)l.append(el('div','sm',i.sub));
  const bt=el('div','bt'),bf=el('div','bf');bf.style.width=(i.v?Math.max(3,i.v/mx*100):0)+'%';bt.append(bf);
  r.append(l,bt,el('div','iv',i.text));s.append(r)}
}
function mk(text,opts,val,fn){const l=el('label','',text),s=document.createElement('select');
 for(const o of opts){const e=document.createElement('option');e.value=o[0];e.textContent=o[1];s.append(e)}
 s.value=val;s.onchange=()=>fn(s.value);l.append(s);return l}
function renderInsights(){
 const xs=$('#xsp'),cur=xs.value,sps=[...new Set(ALL.map(c=>c.species).filter(Boolean))].sort();
 xs.replaceChildren(...[''].concat(sps).map(v=>{const o=document.createElement('option');o.value=v;o.textContent=v||'All species';return o}));
 xs.value=sps.indexOf(cur)>=0?cur:'';
 const rows=ALL.filter(c=>(!xs.value||c.species===xs.value)&&c.length>0),out=$('#xout');out.replaceChildren();
 if(!rows.length){out.append(el('p','empty','Nothing to analyze yet. Log or import some catches first.'));return}
 const L=lensOf(rows),days=new Set(rows.filter(c=>dkey(c)).map(c=>c.date)).size,lakes=new Set(rows.map(c=>c.lake).filter(Boolean)).size;
 out.append(el('p','sub',nC(rows.length)+' on '+days+(days===1?' day':' days')+' across '+lakes+(lakes===1?' lake':' lakes')+' | avg '+AVG(L)+'″ | longest '+MAXV(L)+'″'));
 out.append(el('p','sm','These numbers come only from catches, with no record of hours fished, so they show when and where fish were caught, not necessarily where fishing is best. Small samples can mislead.'));
 let s=sec('lake','Personal bests by lake');
 bars(s,grp(rows,c=>c.lake).map(([k,r])=>{const b=r.reduce((a,c)=>c.length>a.length?c:a);
  return{label:k||'Not recorded',sub:[xs.value?'':b.species,dl(b.date),nC(r.length)].filter(Boolean).join(' | '),v:b.length,text:b.length+'″'}}).sort((a,b)=>b.v-a.v));
 out.append(s);
 s=sec(lureIcon(),'Lures');
 const row=el('div','row');
 row.append(mk('Rank by',[['count','Most catches'],['avg','Average length'],['long','Longest fish']],XS.metric,v=>{XS.metric=v;renderInsights()}),
  mk('Show',[['lure','Lure only'],['mix','Lure and color']],XS.view,v=>{XS.view=v;renderInsights()}));s.append(row);
 const key=c=>XS.view==='mix'?(c.lure&&c.lure+(c.pattern?' ('+c.pattern+')':'')):c.lure;
 const lg=grp(rows,key).filter(x=>x[0]),nolure=rows.length-lg.reduce((a,x)=>a+x[1].length,0);
 const val=r=>XS.metric==='count'?r.length:XS.metric==='avg'?AVG(lensOf(r)):MAXV(lensOf(r));
 const txt=r=>XS.metric==='count'?nC(r.length):XS.metric==='avg'?AVG(lensOf(r))+'″ avg':MAXV(lensOf(r))+'″';
 bars(s,lg.map(([k,r])=>({label:k,sub:nC(r.length)+' | avg '+AVG(lensOf(r))+'″ | best '+MAXV(lensOf(r))+'″',v:val(r),text:txt(r)})).sort((a,b)=>b.v-a.v).slice(0,10));
 if(nolure)s.append(el('p','sm',nC(nolure)+' with no lure recorded are left out.'));
 out.append(s);
 const tr=rows.filter(c=>c.time);
 if(tr.length){s=sec('clock','Time of day');
  const hs=tr.map(c=>+c.time.slice(0,2)),lo=Math.min.apply(null,hs),hi=Math.max.apply(null,hs),it=[];
  for(let h=lo;h<=hi;h++){const r=tr.filter(c=>+c.time.slice(0,2)===h);
   it.push({label:((h%12)||12)+(h<12?' AM':' PM'),v:r.length,text:r.length?r.length+' | avg '+AVG(lensOf(r))+'″':'0'})}
  bars(s,it);if(tr.length<rows.length)s.append(el('p','sm',nC(rows.length-tr.length)+' with no time recorded are left out.'));out.append(s)}
 const wr=grp(rows,c=>c.weather).filter(x=>x[0]);
 if(wr.length){s=sec('cloudsun','Weather');
  bars(s,wr.map(([k,r])=>({label:k,sub:'best '+MAXV(lensOf(r))+'″',v:r.length,text:r.length+' | avg '+AVG(lensOf(r))+'″'})).sort((a,b)=>b.v-a.v));out.append(s)}
 const ar=grp(rows,c=>c.angler).filter(x=>x[0]);
 if(ar.length){s=sec('person','Anglers');
  bars(s,ar.map(([k,r])=>({label:k,sub:'avg '+AVG(lensOf(r))+'″ | best '+MAXV(lensOf(r))+'″',v:r.length,text:nC(r.length)})).sort((a,b)=>b.v-a.v));out.append(s)}
}
$('#xsp').onchange=renderInsights;

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
