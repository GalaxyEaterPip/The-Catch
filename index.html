<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Catch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Catch">
<meta name="theme-color" content="#0d2526">
<style>
:root{--bg:#0d2526;--panel:#143537;--ink:#e6efe9;--mute:#8fb0a8;--brass:#d9a441;--line:#24494b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font:700 28px Georgia,serif;margin:8px 0 2px;display:flex;align-items:center;gap:10px}
h1 .ic{color:var(--brass);width:1.1em;height:1.1em}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:8px 4px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.on{background:var(--brass);color:#1a1405;border-color:var(--brass);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
form{display:grid;gap:12px}
label{display:grid;gap:4px;color:var(--mute);font-size:14px}
.lb{display:flex;align-items:center;gap:6px}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{padding:12px;border:0;border-radius:8px;background:var(--brass);color:#1a1405;font:600 16px system-ui;display:flex;align-items:center;justify-content:center;gap:8px}
.fish{background:var(--panel);border-radius:12px;overflow:hidden;margin-bottom:16px}
.fish img{display:block;width:100%;max-height:420px;object-fit:cover}
.body{padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.len{font:700 44px/1 Georgia,serif;color:var(--brass);grid-row:span 2}
.len small{font-size:20px}
.t{display:flex;align-items:center;gap:8px;font-weight:600}
.m{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.m.note{color:var(--ink);align-items:flex-start;font-size:15px}
.m.note .ic{margin-top:3px}
.det{grid-column:1/-1;display:grid;gap:6px;margin-top:8px}
.del{grid-column:1/-1;justify-self:end;display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:4px 0}
.empty{color:var(--mute);text-align:center;padding:32px 0}
.empty .ic{width:48px;height:48px;color:var(--brass);display:block;margin:0 auto 8px}
.tools{text-align:center;margin:24px 0}
.tools button{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:8px;font:inherit}
.pvw{overflow-x:auto;margin:12px 0}.pv{border-collapse:collapse;font-size:13px;white-space:nowrap}.pv th,.pv td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}.bad{color:#ff9d8a}
details{margin:4px 0 12px}summary{color:var(--mute);cursor:pointer;margin-bottom:8px}
.ic.wide{width:2.6em;height:1.05em}.empty .ic.wide{width:130px;height:53px}
.bar{display:grid;gap:12px;margin-bottom:16px}
.gh{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;margin:4px 0 12px;font:inherit;text-align:left}
.gh .n{font-weight:600;flex:1}.gh .s{color:var(--mute);font-size:13px}.gh .ic{color:var(--brass)}
.gh .chev{color:var(--mute);transition:transform .15s}.grp.shut .chev{transform:rotate(-90deg)}.grp{margin-bottom:8px}
.sec{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.sec h2{font:700 18px Georgia,serif;margin:0 0 10px;display:flex;align-items:center;gap:8px}.sec h2 .ic{color:var(--brass)}
.sec .row{margin-bottom:10px}.sec select{background:var(--bg)}
.ibar{display:grid;grid-template-columns:34% 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bt{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bf{height:100%;background:var(--brass);border-radius:5px}
.iv{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}.sm{color:var(--mute);font-size:13px}
.tools button{margin:4px}
[hidden]{display:none}
</style></head><body>

<section id="log">
<div class="bar">
<label><span class="lb"><svg class="ic"><use href="#i-search"/></svg>Search</span><input id="q" type="search" placeholder="Lure, lake, notes, anything"></label>
<div class="row"><label><span class="lb"><svg class="ic"><use href="#i-sort"/></svg>Sort</span><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="long">Longest first</option><option value="short">Shortest first</option></select></label>

</div>
<div id="list"></div>
<div class="tools"><button id="exp"><svg class="ic"><use href="#i-download"/></svg>Save a backup file</button><button id="rst"><svg class="ic"><use href="#i-upload"/></svg>Restore or merge a backup</button></div></section>

<section id="add" hidden><form id="f">

<div class="row"><label><span class="lb"><svg class="ic"><use href="#i-calendar"/></svg>Date</span><input type="date" name="date" required></label>
<label><span class="lb"><svg class="ic"><use href="#i-clock"/></svg>Time</span><input type="time" name="time"></label></div>
<div class="row"><label><span class="lb"><svg class="ic"><use href="#i-ruler"/></svg>Length (inches)</span><input type="number" name="length" step="any" min="0" inputmode="decimal" required></label>

</section>

<script>
const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
let db;
const open=indexedDB.open('muskielog',1);
open.onupgradeneeded=()=>open.result.createObjectStore('catches',{keyPath:'id'});
open.onsuccess=()=>{db=open.result;load();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()};
const store=m=>db.transaction('catches',m).objectStore('catches');
const run=q=>new Promise(r=>{q.onsuccess=()=>r(q.result)});
const all=()=>run(store('readonly').getAll());
const put=c=>run(store('readwrite').put(c));

async function shrink(file){
 const img=new Image();img.src=URL.createObjectURL(file);await img.decode();
 const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
 const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}

function renderList(){

 $('#count').textContent=q?rows.length+' of '+n+' catches match':(n===1?'1 catch logged':n+' catches logged');
 const list=$('#list');list.replaceChildren();
 if(!n){const e=el('p','empty');e.append(ic('fish'),'No catches yet. Tap "Add" to log your first.');list.append(e);return}
 if(!rows.length){list.append(el('p','empty','No catches match your search.'));return}
 const g=GROUPS[VIEW.group];
 if(!g){rows.forEach(c=>list.append(card(c)));return}
 const map=new Map();
 for(const c of rows){const k=g.key(c)||'';if(!map.has(k))map.set(k,[]);map.get(k).push(c)}
 const arr=[...map].map(([k,r])=>({k,r,label:k?(g.label?g.label(k):k):'Not recorded'}));
 if(g.time)arr.sort((a,b)=>VIEW.sort==='old'?a.k.localeCompare(b.k):b.k.localeCompare(a.k));
 else arr.sort((a,b)=>(!a.k-!b.k)||b.r.length-a.r.length||a.label.localeCompare(b.label));
 for(const x of arr){
  const lens=x.r.map(c=>c.length).filter(v=>v>0);
  const avg=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length*10)/10:0;
  const stats=x.r.length+(x.r.length===1?' catch':' catches')+(lens.length?' | avg '+avg+'″ | longest '+Math.max.apply(null,lens)+'″':'');
  const wrap=el('div','grp'),h=el('button','gh'),body=el('div'),cv=ic('chev');cv.classList.add('chev');h.type='button';
  h.append(ic(g.icon||(x.k?wicon(x.k):'cloud')),el('span','n',x.label),el('span','s',stats),cv);
  h.onclick=()=>{body.hidden=wrap.classList.toggle('shut')};
  x.r.forEach(c=>body.append(card(c)));wrap.append(h,body);list.append(wrap);
 }
}

const WEATHER=[['sunny (in shade)','Sunny (in shade)'],['sunny/shade','Sunny (in shade)'],['sunny','Sunny'],['partly cloudy','Partly cloudy'],['mostly cloudy','Mostly cloudy'],['overcast','Overcast'],['light rain','Light rain'],['light drizzle','Drizzle'],['drizzle','Drizzle'],['rain','Rain'],['sleet','Sleet'],['snow','Snow']];
const SPECIES={muskie:'Muskellunge',musky:'Muskellunge',muskellunge:'Muskellunge',pike:'Northern Pike',lmb:'Largemouth Bass',walleye:'Walleye',bass:'Bass',smallmouth:'Smallmouth Bass',largemouth:'Largemouth Bass',perch:'Perch',crappie:'Crappie'};
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
const title=s=>s.replace(/(^|[\s\/-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function parseNote(text,cfg){
 const rows=[],warn=[];let date='',lake='',spot='',pend=false,last=null;
 for(const raw of text.split(/\r?\n/)){
  const ln=raw.trim();if(!ln)continue;
  let m=ln.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];date=y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');lake='';spot='';pend=false;last=null;continue}
  m=ln.match(/^(\d+(?:\.\d+)?)\s*(?:"|”|″|in\b|inch(?:es)?\b)?\s*(.*)$/i);
  if(!(m&&/\d{1,2}(?::\d{2})?\s*[ap]\.?m/i.test(ln))){
   if(!date){warn.push('Skipped (no date yet): '+ln);continue}
   const t=ln.replace(/^['"‘’“”]+|['"‘’“”]+$/g,'');
   if(/^['"‘“]/.test(ln)){spot=t;pend=true;last=null}
   else{lake=t;spot='';pend=false;last=null}
   continue}
  const length=parseFloat(m[1]);let rest=m[2];
  const sp=rest.match(/^(\S+)\s*(.*)$/);rest=sp[2];
  let species=SPECIES[sp[1].toLowerCase()];
  if(!species){species=title(sp[1].toLowerCase());warn.push('Unknown species "'+sp[1]+'" on: '+ln)}
  const tm=rest.match(/^(.*?)\s*(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m\.?\s*(.*)$/i);
  if(!tm){warn.push('Could not read: '+ln);continue}
  const wt=tm[1].trim();let weather='';
  if(wt){const hit=WEATHER.find(w=>w[0]===wt.toLowerCase());weather=hit?hit[1]:wt.charAt(0).toUpperCase()+wt.slice(1).toLowerCase()}
  const mn=tm[3]||'00',h=(+tm[2])%12+(tm[4].toLowerCase()==='p'?12:0),mins=h*60+(+mn);
  const time=String(h).padStart(2,'0')+':'+mn;rest=tm[5];
  const am=rest.match(/^(\S+)\s*(.*)$/);const code=am?am[1]:'';rest=am?am[2]:'';
  const angler=cfg.anglers[code.toLowerCase()]||code;
  let lure=rest,pattern='',assumed=false,unknown=true,notes='';
  for(const L of cfg.lures){
   const re=new RegExp('(^|\\s)'+esc(L.key)+'(?=\\s|$)','i'),mm=re.exec(rest);
   if(!mm)continue;
   unknown=false;lure=L.name;
   const ks=mm.index+mm[1].length;let before=rest.slice(0,ks).trim(),after=rest.slice(ks+L.key.length).trim(),col=null;
   for(const c of cfg.colors){
    const rb=new RegExp('(^|\\s)'+esc(c.key)+'$','i'),ra=new RegExp('^'+esc(c.key)+'(?=\\s|$)','i');
    if(rb.test(before)){col=c;before=before.replace(rb,'').trim();break}
    if(ra.test(after)){col=c;after=after.replace(ra,'').trim();break}
   }
   if(col)pattern=col.name;else if(L.def){pattern=L.def;assumed=true}
   notes=(before+' '+after).replace(/\s+/g,' ').trim();break}
  let where='';
  if(pend){where=spot;pend=false;last=mins}
  else if(spot&&last!==null&&mins>=last&&mins-last<=15){where=spot;last=mins}
  else last=null;
  rows.push({date,time,length,species,lake,weather,angler,lure,pattern,patternAssumed:assumed,spot:where,notes,unknown});
 }
 return {rows,warn};
}
const key=c=>[c.date,c.time,c.length,(c.lake||'').toLowerCase()].join('|');

 const wr=grp(rows,c=>c.weather).filter(x=>x[0]);
 if(wr.length){s=sec('cloudsun','Weather');
  bars(s,wr.map(([k,r])=>({label:k,sub:'best '+MAXV(lensOf(r))+'″',v:r.length,text:r.length+' | avg '+AVG(lensOf(r))+'″'})).sort((a,b)=>b.v-a.v));out.append(s)}
 const ar=grp(rows,c=>c.angler).filter(x=>x[0]);
